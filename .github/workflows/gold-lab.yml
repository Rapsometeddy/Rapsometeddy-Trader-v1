name: Gold Lab 1m paper snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: gold-lab-snapshot
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build news-blind gold snapshot
        run: python scripts/update_gold_lab.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/gold.json
          git diff --cached --quiet || (git commit -m "Update Gold Lab paper snapshot" && git push)
